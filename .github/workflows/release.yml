name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          cat > /tmp/notes.md <<EOF
          Official TypeScript client for tonia Pass (\`@tonia-router/sdk\`).

          Stream cancel: pass \`{ signal }\` into \`.stream()\` / \`.create()\`.
          \`AbortController.abort()\` or \`break\` hangs up the Pass socket.

          Audio support: \`audio.speech.create\` (TTS) and
          \`audio.transcriptions.create\` (multipart STT). Gemini token
          TTS/STT uses \`interactions.create\`. Sold examples:
          \`mistral/voxtral-mini-tts-2603\`, \`openai/gpt-transcribe\`.
          Workspace audio must be on (portal \`/dlp\`).

          Realtime opens native with transcripts by default. Cascaded mode
          and text turns are not offered.

          Install until npm: \`npm add https://github.com/tonia-router/typescript-sdk/releases/download/${TAG}/tonia-router-sdk-${TAG#v}.tgz\`

          Requires Node.js 22+. Apache 2.0, copyright 2026 tonia inc.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" tonia-router-sdk-*.tgz --clobber
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md tonia-router-sdk-*.tgz
          fi
      - name: Publish to npm
        run: npm publish --access public --provenance
