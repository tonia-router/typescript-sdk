name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          cat > /tmp/notes.md <<EOF
          Official TypeScript client for tonia Pass (\`@tonia/sdk\`).

          Install from npm after registry publish: \`npm add @tonia/sdk\`

          From this release:

              npm add https://github.com/tonia-router/typescript-sdk/releases/download/${TAG}/tonia-sdk-0.2.1.tgz

          Requires Node.js 22+. Apache 2.0, copyright 2026 tonia inc.
          EOF
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md tonia-sdk-*.tgz
